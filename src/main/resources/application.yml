spring:
  application:
    name: transaction-lab
  jackson:
    time-zone: UTC

server:
  port: 8080

lab:
  generator:
    enabled: ${GENERATOR_ENABLED:true}
    interval-ms: ${GENERATOR_INTERVAL_MS:5000}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
