apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: transaction-lab
data:
  fluent-bit.yaml: |
    service:
      flush: 5
      log_level: info

    parsers:
      - name: transaction_json
        format: json

    pipeline:
      inputs:
        - name: tail
          tag: transacoes
          path: /var/log/containers/transaction-api*_transaction-lab_*.log
          multiline.parser: cri
          db: /fluent-bit/state/pos.db
          refresh_interval: 5
          read_from_head: false
          mem_buf_limit: 10M

      filters:
        - name: parser
          match: transacoes
          key_name: log
          parser: transaction_json
          reserve_data: on

      outputs:
        - name: opensearch
          match: transacoes
          host: host.minikube.internal
          port: 9200

          http_user: ${OS_USERNAME}
          http_passwd: ${OS_PASSWORD}

          tls: on
          tls.verify: off

          index: transaction-logs
          suppress_type_name: on
          replace_dots: on

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: transaction-lab
spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      automountServiceAccountToken: false

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          imagePullPolicy: IfNotPresent

          args:
            - --config=/fluent-bit/etc/fluent-bit.yaml

          env:
            - name: OS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-auth
                  key: username

            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-auth
                  key: password

          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 150Mi

          volumeMounts:
            - name: node-logs
              mountPath: /var/log
              readOnly: true

            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.yaml
              subPath: fluent-bit.yaml
              readOnly: true

            - name: state
              mountPath: /fluent-bit/state

      volumes:
        - name: node-logs
          hostPath:
            path: /var/log
            type: Directory

        - name: config
          configMap:
            name: fluent-bit-config

        - name: state
          emptyDir: {}
