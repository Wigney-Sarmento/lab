# __IMAGE__ e substituida automaticamente pelo Jenkins durante o deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: transaction-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      containers:
        - name: transaction-api
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GENERATOR_ENABLED
              value: "true"
            - name: GENERATOR_INTERVAL_MS
              value: "5000"
            - name: OTEL_SERVICE_NAME
              value: transaction-lab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://192.168.1.143:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=lab
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: transaction-lab
spec:
  selector:
    app: transaction-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
